[project]
name = "hindi-benchmark-harmonization"
version = "0.1.0"
description = "Cross-benchmark consistency study for Hindi LLM evaluation"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "google-genai>=1.0",
    "groq>=0.9",
    "openai>=1.40",
    "together>=1.3",
    "absl-py>=2.1",
    "langdetect>=1.0.9",
    "immutabledict>=4.2",
    "nltk>=3.9",
    "scipy>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    "modal>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]